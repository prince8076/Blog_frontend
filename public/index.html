<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://blog-backend-fd7d.onrender.com" />
    <meta
      name="description"
      content="SuccessWebTech Blog — insights on Tech, Travel, and Lifestyle."
    />
    <link rel="canonical" href="https://successwebtech.in/" />
    <meta property="og:title" content="SuccessWebTech Blog — Tech, Travel &amp; Lifestyle" />
    <meta property="og:description" content="SuccessWebTech Blog — insights on Tech, Travel, and Lifestyle." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://successwebtech.in/" />
    <meta property="og:site_name" content="SuccessWebTech Blog" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SuccessWebTech Blog — Tech, Travel &amp; Lifestyle" />
    <meta name="twitter:description" content="SuccessWebTech Blog — insights on Tech, Travel, and Lifestyle." />
    <!-- No og:image: the site has no suitable PNG/JPG brand image (the logo
         is SVG, which most social crawlers do not use as an OG image), and
         inventing one would be worse than omitting it. Per-article OG tags
         are not possible in this client-rendered app without prerendering;
         see SEO.md. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Blog",
          "name": "SuccessWebTech Blog",
          "url": "https://successwebtech.in/",
          "description": "SuccessWebTech Blog — insights on Tech, Travel, and Lifestyle.",
          "inLanguage": "en"
        },
        {
          "@type": "WebSite",
          "name": "SuccessWebTech Blog",
          "url": "https://successwebtech.in/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://successwebtech.in/search?query={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>SuccessWebTech Blog — Tech, Travel &amp; Lifestyle</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
